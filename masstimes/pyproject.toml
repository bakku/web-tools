[project]
name = "masstimes"
version = "0.1.0"
description = "See mass times or other church events for different churches."
readme = "README.md"
authors = [
    { name = "Christian Paling", email = "christian.paling@googlemail.com" }
]
requires-python = ">=3.14.2"
dependencies = [
    "fastapi[standard]==0.128.0",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "ruff==0.12.10",
]

[tool.uv]
required-version = ">=0.9.26"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
lint.select = ["E", "F", "I"]
